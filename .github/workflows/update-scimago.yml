name: Update Scimago Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find Scimago CSV
        id: find_csv
        run: |
          CSV=$(ls scimagojr*.csv 2>/dev/null | head -1)
          if [ -z "$CSV" ]; then
            echo "No scimagojr*.csv found in repo root"
            exit 1
          fi
          echo "csv=$CSV" >> $GITHUB_OUTPUT
          echo "Found: $CSV"

      - name: Convert CSV to JSON
        run: |
          python3 - <<'PYEOF'
          import csv, json, sys

          csv_file = "${{ steps.find_csv.outputs.csv }}"
          out = {}

          with open(csv_file, newline='', encoding='utf-8-sig') as f:
              reader = csv.DictReader(f, delimiter=';')
              for row in reader:
                  issns_raw = row.get('Issn', '') or row.get('ISSN', '') or ''
                  quartile  = row.get('SJR Best Quartile', '') or row.get('SJR_Quartile', '')
                  if not quartile or quartile.strip() == '-':
                      continue
                  quartile = quartile.strip()
                  for issn in issns_raw.split(','):
                      issn = issn.strip().replace('-', '').upper()
                      if len(issn) == 8 and issn[:7].isdigit() and (issn[7].isdigit() or issn[7] == 'X'):
                          out[issn] = quartile

          with open('scimago_issn.json', 'w') as f:
              json.dump(out, f, separators=(',', ':'))

          print(f"Done: {len(out)} ISSNs written to scimago_issn.json")
          PYEOF

      - name: Commit updated JSON
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scimago_issn.json
          git diff --cached --quiet || git commit -m "chore: update scimago_issn.json from ${{ steps.find_csv.outputs.csv }}"
          git push
