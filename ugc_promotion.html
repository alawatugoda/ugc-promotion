<!DOCTYPE html>
<title>UGC Promotion Self-Assessment</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#f7f6f3;--surface:#fff;--surface2:#f0efe9;--border:#e3e1db;
  --fg:#1a1917;--fg2:#6b6762;--fg3:#9d9994;
  --accent:#1d4ed8;--accent-soft:#dbeafe;
  --green:#15803d;--green-bg:#dcfce7;--green-border:#86efac;
  --red:#b91c1c;--red-bg:#fee2e2;
  --amber:#92400e;--amber-bg:#fef3c7;
}
[data-theme="dark"]{
  --bg:#111110;--surface:#1c1b19;--surface2:#252420;--border:#2e2d2a;
  --fg:#f0ede8;--fg2:#888480;--fg3:#55524e;
  --accent:#60a5fa;--accent-soft:#1e3a5f;
  --green:#4ade80;--green-bg:#052e16;--green-border:#166534;
  --red:#f87171;--red-bg:#450a0a;color-scheme:dark;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111110;--surface:#1c1b19;--surface2:#252420;--border:#2e2d2a;
  --fg:#f0ede8;--fg2:#888480;--fg3:#55524e;
  --accent:#60a5fa;--accent-soft:#1e3a5f;
  --green:#4ade80;--green-bg:#052e16;--green-border:#166534;
  --red:#f87171;--red-bg:#450a0a;color-scheme:dark;
}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--fg);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.5;}
.app{display:grid;grid-template-columns:320px 1fr;min-height:100vh;}
@media(max-width:900px){.app{grid-template-columns:1fr;}}
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  :root,[data-theme="dark"],:root:not([data-theme="light"]){
    --bg:#fff!important;--surface:#fff!important;--surface2:#f5f5f5!important;--border:#ccc!important;
    --fg:#000!important;--fg2:#333!important;--fg3:#666!important;
    --accent:#1d4ed8!important;--accent-soft:#dbeafe!important;
    --green:#15803d!important;--green-bg:#dcfce7!important;--green-border:#86efac!important;
    --red:#b91c1c!important;--red-bg:#fee2e2!important;
    color-scheme:light!important;
  }
  .sidebar,.no-print{display:none!important;}
  .main{padding:0!important;}
  .app{display:block;}
  .pub-sec{page-break-inside:avoid;border:1px solid #ccc;margin-bottom:8px;}
  th,td{padding:4px 6px;font-size:10px;}
  .del-btn,.drag-handle,.no-print,.move-sel{display:none!important;}
  .print-cover{display:block!important;}
  body{font-size:11px;}
  .page-break{page-break-before:always;}
  .tab-pane{display:none!important;}
  .tab-bar,.main>.tab-bar{display:none!important;}
  .print-cover a{color:#1d4ed8!important;text-decoration:underline;}
}

/* Sidebar */
.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:16px;overflow-y:auto;position:sticky;top:0;max-height:100vh;}
.logo{font-size:.92rem;font-weight:700;display:flex;align-items:center;justify-content:space-between;}
.logo-sub{font-size:.7rem;color:var(--fg2);margin-bottom:10px;}
.theme-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:.75rem;cursor:pointer;color:var(--fg2);}
.top-btns{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:12px;}
.tbtn{padding:6px 4px;border:1px solid var(--border);border-radius:7px;background:var(--surface2);color:var(--fg);font-size:.72rem;font-weight:600;cursor:pointer;text-align:center;transition:background .15s;}
.tbtn:hover{background:var(--border);}
.tbtn.accent{background:var(--accent);color:#fff;border-color:var(--accent);}
.tbtn.green{background:var(--green-bg);color:var(--green);border-color:var(--green-border);}
.field{margin-bottom:8px;}
.field label{display:block;font-size:.68rem;font-weight:600;color:var(--fg2);margin-bottom:2px;text-transform:uppercase;letter-spacing:.04em;}
.field input,.field select,.field textarea{width:100%;padding:6px 9px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--fg);font-size:.82rem;font-family:inherit;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);}
.divider{font-size:.68rem;font-weight:700;color:var(--fg3);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px;padding-top:10px;border-top:1px solid var(--border);}
.load-msg{font-size:.75rem;color:var(--fg2);margin:4px 0 6px;min-height:1rem;}
.load-msg.err{color:var(--red);}

/* Score tiles */
.tiles-row{display:none;grid-template-columns:repeat(4,1fr) 1.2fr;gap:8px;margin-bottom:16px;}
@media print{.tiles-row{display:none!important;}}
.tile{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;text-align:center;}
.tile.t-ok{border-color:var(--green-border);background:var(--green-bg);}
.tile.t-warn{border-color:#fca5a5;background:var(--red-bg);}
.tile-val{font-size:1.4rem;font-weight:700;}
.tile-label{font-size:.65rem;color:var(--fg2);margin-top:2px;}

/* Main */
.main{padding:20px;max-width:1200px;}
.main-title{font-size:1.1rem;font-weight:700;margin-bottom:2px;}
.main-sub{font-size:.8rem;color:var(--fg2);margin-bottom:16px;}
@media print{.main-title,.main-sub{display:none!important;}}
.hdr-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.hdr-btn{padding:5px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface2);color:var(--fg);font-size:.75rem;cursor:pointer;}
.hdr-btn:hover{background:var(--border);}
.hdr-btn.print{background:var(--accent);color:#fff;border-color:var(--accent);}

/* Section ribbons */
.sec-ribbon{display:flex;justify-content:space-between;align-items:center;padding:7px 14px;font-weight:700;color:#fff;margin-top:12px;border-radius:6px 6px 0 0;letter-spacing:.02em;}
.sec-ribbon.l1{background:#1a2744;font-size:.85rem;margin-top:16px;}
.sec-ribbon.l2{background:#1d4ed8;font-size:.78rem;margin-top:6px;margin-left:0;}
.sec-ribbon:first-child{margin-top:0;}
.rib-pts{font-size:.75rem;opacity:.9;white-space:nowrap;}

/* Pub-sec cards */
.pub-sec{background:var(--surface);border:1px solid var(--border);border-radius:0 0 10px 10px;margin-bottom:4px;overflow:hidden;}
.pub-sec-standalone{border-radius:10px;margin-bottom:12px;}
.psec-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;user-select:none;}
.psec-hdr:hover{background:var(--surface2);}
.psec-l{display:flex;align-items:center;gap:10px;}
.psec-title{font-weight:600;font-size:.85rem;}
.psec-sub{font-size:.72rem;color:var(--fg3);}
.pts-chip{background:var(--accent-soft);color:var(--accent);font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap;}
.chev{font-size:.7rem;color:var(--fg3);transition:transform .2s;}
.twrap{overflow-x:auto;}
.twrap.open{}
.twrap table{width:100%;border-collapse:collapse;font-size:.8rem;}
.twrap th{background:var(--surface2);padding:6px 10px;text-align:left;font-size:.7rem;font-weight:600;color:var(--fg2);border-bottom:1px solid var(--border);white-space:nowrap;}
.twrap td{padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
.twrap tr:last-child td{border-bottom:none;}
.td-title{max-width:280px;}
.td-edit{width:100%;border:none;background:transparent;color:var(--fg);font-size:.8rem;font-family:inherit;padding:0;}
.td-edit:focus{outline:1px solid var(--accent);border-radius:3px;padding:1px 3px;}
.td-pts{font-weight:700;text-align:center;min-width:50px;}
.del-btn{background:none;border:none;color:var(--fg3);cursor:pointer;font-size:.9rem;padding:2px 4px;}
.del-btn:hover{color:var(--red);}
.psec-foot{padding:6px 14px;font-size:.78rem;color:var(--fg2);border-top:1px solid var(--border);text-align:right;}
.empty-s{text-align:center;padding:16px;color:var(--fg3);font-size:.8rem;}

/* Move dropdown */
.move-sel{font-size:.72rem;border:1px solid var(--border);border-radius:4px;background:var(--surface2);color:var(--accent);padding:2px 2px;cursor:pointer;max-width:40px;}

/* Manual items */
.item-list{margin:4px 0;}
.item-row{display:flex;gap:6px;align-items:center;margin-bottom:4px;}
.item-row input[type="text"]{flex:1;padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--fg);font-size:.8rem;}
.pts-in{width:60px;padding:5px 6px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--fg);font-size:.8rem;text-align:center;}
.add-btn{font-size:.72rem;color:var(--accent);background:none;border:none;cursor:pointer;padding:1px 0;}
.add-btn:hover{text-decoration:underline;}

/* Date inputs */
.date-in{width:110px;padding:3px 5px;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--fg);font-size:.72rem;}
.reset-btn{background:none;border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:.7rem;cursor:pointer;color:var(--fg3);}
.reset-btn:hover{color:var(--accent);border-color:var(--accent);}

/* WoS / freq badges */
.badge{display:inline-block;font-size:.65rem;font-weight:700;padding:1px 6px;border-radius:3px;margin-right:3px;}
.b-wos{background:#e0f2fe;color:#0369a1;}

/* Eligibility bar */
.elig-bar{padding:8px 14px;font-size:.8rem;border-radius:8px;margin-bottom:12px;display:none;}
.elig-bar.ok{background:var(--green-bg);color:var(--green);}
.elig-bar.warn{background:var(--red-bg);color:var(--red);}

/* Add paper box */
.manual-add-box{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:12px;}
.manual-add-fields{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;}
@media(max-width:600px){.manual-add-fields{grid-template-columns:1fr;}}
.sm-btn{padding:5px 9px;border:1px solid var(--border);border-radius:6px;background:var(--surface2);color:var(--fg);font-size:.75rem;cursor:pointer;font-family:inherit;}
.sm-btn:hover{background:var(--border);}
.sm-btn.accent{background:var(--accent);color:#fff;border-color:var(--accent);}
.contrib-in{width:52px;padding:3px 5px;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--fg);font-size:.75rem;text-align:center;}

/* Print cover */
.print-cover{display:none;}

/* Tabs */
.tab-bar{display:flex;gap:4px;margin-bottom:12px;border-bottom:2px solid var(--border);}
.tab-btn{padding:8px 16px;border:none;border-bottom:2px solid transparent;background:none;font-size:.82rem;font-weight:600;color:var(--fg2);cursor:pointer;margin-bottom:-2px;border-radius:4px 4px 0 0;transition:color .15s,background .15s;}
.tab-btn:hover{background:var(--surface2);}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);background:var(--accent-soft);}
.tab-pane{display:none;}
.tab-pane.active{display:block;}
</style>

<div class="app">
<!-- ══ SIDEBAR ══ -->
<div class="sidebar no-print">
  <div class="logo">
    <span>UGC Promotion Assessment</span>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌙 Dark</button>
  </div>
  <div class="logo-sub">Merit Promotion — Associate Prof / Professor</div>

  <div class="top-btns">
    <button class="tbtn accent" id="saveEvBtn" onclick="saveAll()" title="Save JSON + evidence PDFs to folder" style="position:relative">💾 Save<span id="saveEvDot" style="display:none;position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:#f59e0b"></span></button>
    <button class="tbtn" onclick="document.getElementById('jsonIn').click()">📂 Load</button>
    <button class="tbtn green" id="printBtn" onclick="window.print()" style="display:none">🖨️ Print</button>
    <button class="tbtn" onclick="toggleAll()">⊞ Expand</button>
    <button class="tbtn" onclick="evidenceFolderHandle=null;saveAll()" title="Change save folder">📂 Change Folder</button>
    <button class="tbtn" id="relinkBtn" onclick="relinkEvidenceFolder()" style="display:none" title="Re-link evidence files from folder after loading JSON">🔗 Re-link Evidence</button>
  </div>
  <input type="file" id="jsonIn" accept=".json" style="display:none" onchange="importJSON(this)">

  <div class="divider">Personal Details</div>
  <div class="field"><label>Full Name</label><input type="text" id="f_name" placeholder="Your full name" oninput="updateHeader()"></div>
  <div class="field"><label>Designation</label><input type="text" id="f_desig" placeholder="e.g. Senior Lecturer Gr. I"></div>
  <div class="field"><label>Department / Faculty</label><input type="text" id="f_dept" placeholder="Department name"></div>
  <div class="field"><label>Institution</label><input type="text" id="f_inst" placeholder="University name" oninput="updateHeader()"></div>
  <div class="field"><label>Applying for</label>
    <select id="f_post" onchange="recalc()">
      <option value="assoc_internal">Associate Professor (Internal)</option>
      <option value="assoc_external">Associate Professor (External)</option>
      <option value="prof_merit">Professor (Merit Promotion)</option>
      <option value="prof_cadre">Professor (Cadre/Advertised)</option>
    </select>
  </div>
  <div class="field"><label>OpenAlex Author ID</label><input type="text" id="f_oaid" placeholder="e.g. A5056029451"></div>
  <div class="field"><label>Date range — From</label><input type="text" id="d_from" value="01/01/2015" placeholder="DD/MM/YYYY"></div>
  <div class="field"><label>Date range — To</label><input type="text" id="d_to" value="13/11/2026" placeholder="DD/MM/YYYY"></div>
  <button class="tbtn accent" style="width:100%;margin-top:4px" onclick="fetchAll()">🔍 Fetch Data</button>
  <div class="load-msg" id="loadMsg"></div>

  <input type="hidden" id="f_citations" value="0">

  <div class="divider">Minimum Requirements</div>
  <div id="minReqs" style="font-size:.74rem;color:var(--fg2);line-height:1.8"></div>
</div>

<!-- ══ MAIN ══ -->
<div class="main">
  <div class="hdr-row">
    <div>
      <div class="main-title" id="mainTitle">UGC Promotion Assessment</div>
      <div class="main-sub" id="mainSub">Fill in your details and fetch publications</div>
    </div>
    <button class="hdr-btn print no-print" onclick="window.print()">🖨️ Print / PDF</button>
  </div>


  <!-- Score tiles -->
  <div class="tiles-row" id="tilesRow">
    <div class="tile" id="t1"><div class="tile-val" id="tv1">0</div><div class="tile-label">§1 Teaching</div></div>
    <div class="tile" id="t2"><div class="tile-val" id="tv2">0</div><div class="tile-label">§2 Research</div></div>
    <div class="tile" id="t3"><div class="tile-val" id="tv3">0</div><div class="tile-label">§3 University</div></div>
    <div class="tile" id="ttot"><div class="tile-val" id="tvtot">0</div><div class="tile-label">Total</div></div>
    <div class="tile" id="t211"><div class="tile-val" id="tv211">0</div><div class="tile-label">§2.1.1 Journals</div></div>
  </div>

  <!-- Tabs -->
  <div class="tab-bar no-print">
    <button class="tab-btn active" onclick="switchTab('tab1',this)">§1 — Teaching</button>
    <button class="tab-btn" onclick="switchTab('tab2',this)">§2 — Research</button>
    <button class="tab-btn" onclick="switchTab('tab3',this)">§3 — University</button>
  </div>
  <div id="tab1" class="tab-pane active"></div>
  <div id="tab2" class="tab-pane"></div>
  <div id="tab3" class="tab-pane"></div>

  <!-- Print cover -->
  <div class="print-cover" id="printCover"></div>
</div>
</div>

<script>
const MAILTO = 'research@ugc.ac.lk';

const MIN_MARKS = {
  assoc_internal: {s1:10, s2:25, s3:10, total:70,  j211:12},
  assoc_external: {s1:5,  s2:35, s3:5,  total:70,  j211:12},
  prof_merit:     {s1:20, s2:50, s3:10, total:105, j211:12},
  prof_cadre:     {s1:25, s2:55, s3:15, total:115, j211:12},
};

let allJournals=[], allConf=[], allBooks=[], allCitations=[], scimagoData=null, manualItems={};

// ── Date-based sub-sections (start/end date + auto-calc) ──
const DATE_BASED = {
  s1_prep:    {rate:1,   cap:16},
  s1_extra:   {rate:0.5, cap:1},
  s1_excess:  {rate:0.5, cap:4},
  s3_vc:      {rate:2,   cap:10},
  s3_dvc:     {rate:1.5, cap:6},
  s3_hod:     {rate:1,   cap:3},
  s3_dir:     {rate:1,   cap:3},
  s3_pgco:    {rate:1,   cap:3},
  s3_warden:  {rate:1,   cap:3},
  s3_counsel: {rate:1,   cap:3},
  s3_society: {rate:1,   cap:3},
  s3_union:   {rate:1,   cap:3},
  s3_council: {rate:1,   cap:3},
  s3_pres:    {rate:2,   cap:4},
  s3_sec:     {rate:1,   cap:3},
  s3_committee:{rate:1,  cap:3},
  s3_other:   {rate:1,   cap:3},
};

const SUB_SECTIONS = [
  // §1
  {id:'s1_prep',   label:'§1.1 Academic/Professional Preparation',         cap:16,   def:1,   group:'s1', sub:'s1_1'},
  {id:'s1_phd',    label:'§1.2.1 Doctorate/PhD',                           cap:4,    def:4,   group:'s1', sub:'s1_2'},
  {id:'s1_fellow', label:'§1.2.2 Fellowship of Professional Body',          cap:2,    def:2,   group:'s1', sub:'s1_2'},
  {id:'s1_masters',label:'§1.2.3 Masters (2yr research)',                   cap:2,    def:2,   group:'s1', sub:'s1_2'},
  {id:'s1_extra',  label:'§1.3.1 Extra teaching outside discipline',        cap:1,    def:0.5, group:'s1', sub:'s1_3'},
  {id:'s1_excess', label:'§1.3.2 Excess teaching load >25%',               cap:4,    def:0.5, group:'s1', sub:'s1_3'},
  {id:'s1_phdsup', label:'§1.4.1 PhD/DM supervision (4 pts/thesis)',       cap:null, def:4,   group:'s1', sub:'s1_4'},
  {id:'s1_mphil',  label:'§1.4.2 MPhil supervision (2 pts/thesis)',        cap:8,    def:2,   group:'s1', sub:'s1_4'},
  {id:'s1_msc2',   label:'§1.4.3 MSc 2yr supervision (1 pt)',              cap:4,    def:1,   group:'s1', sub:'s1_4'},
  {id:'s1_msclt',  label:'§1.4.4 MSc <2yr supervision (0.5 pt)',           cap:4,    def:0.5, group:'s1', sub:'s1_4'},
  {id:'s1_cpd',    label:'§1.5 CPD — Resource person (1 pt/activity)',     cap:10,   def:1,   group:'s1', sub:'s1_5'},
  {id:'s1_inst_a', label:'§1.6(a) Introduction of new courses/new degree programmes', cap:null, def:1, group:'s1', sub:'s1_6'},
  {id:'s1_inst_b', label:'§1.6(b) Curriculum planning and development', cap:null, def:1, group:'s1', sub:'s1_6'},
  {id:'s1_inst_c', label:'§1.6(c) Development of new material for existing courses (both Undergraduate and Postgraduate)', cap:null, def:1, group:'s1', sub:'s1_6'},
  {id:'s1_inst_d', label:'§1.6(d) Laboratory planning and development', cap:null, def:1, group:'s1', sub:'s1_6'},
  {id:'s1_inst_e', label:'§1.6(e) Strengthening research capacity in the particular HEI as well as in other HEIs', cap:null, def:1, group:'s1', sub:'s1_6'},
  {id:'s1_inst_f', label:'§1.6(f) Inter-faculty teaching', cap:null, def:1, group:'s1', sub:'s1_6'},
  {id:'s1_dual',   label:'§1.7 Transitioning to Dual Delivery',             cap:8,    def:1,   group:'s1', sub:'s1_7'},
  // §2 other
  {id:'s2_book_rec',  label:'§2.2.1a Books/chapters — Recognized publisher (up to 3/ch, 6/book)', cap:null, def:3,   group:'s2other', sub:'s2_2'},
  {id:'s2_book_oth',  label:'§2.2.1b Books/chapters — Other publishers',      cap:25,   def:1,   group:'s2other', sub:'s2_2'},
  {id:'s2_edit',      label:'§2.2.2 Editing collections/books (up to 3/book)',cap:9,    def:3,   group:'s2other', sub:'s2_2'},
  {id:'s2_classic',   label:'§2.2.3 Editing classical work/book reviews',      cap:8,    def:2,   group:'s2other', sub:'s2_2'},
  {id:'s2_trans',     label:'§2.2.4(a) Translation & publication of Books of Scholarly Work (up to 2/book)', cap:4, def:2, group:'s2other', sub:'s2_2'},
  {id:'s2_trans_b',   label:'§2.2.4(b) Bonus for publication with recognized publishers (up to 4/book)', cap:4, def:4, group:'s2other', sub:'s2_2'},
  {id:'s2_eic',       label:'§2.2.5 Editor-in-Chief (up to 1/journal/yr)',     cap:4,    def:1,   group:'s2other', sub:'s2_2'},
  {id:'s2_reviewer',  label:'§2.2.6 Reviewer/Editorial board (up to 0.5/journal/yr)', cap:2, def:0.5, group:'s2other', sub:'s2_2'},
  {id:'s2_creative',  label:'§2.3 Creative work (up to 5/work)',               cap:15,   def:2,   group:'s2other', sub:'s2_3'},
  {id:'s2_patent_nat',label:'§2.4 National patents (up to 2/patent)',           cap:null, def:2,   group:'s2other', sub:'s2_4'},
  {id:'s2_patent_int',label:'§2.4 International patents (up to 4/patent)',      cap:null, def:4,   group:'s2other', sub:'s2_4'},

function parseDMY(s){ const [d,m,y]=(s||'').split('/').map(Number); return (!d||!m||!y)?null:new Date(y,m-1,d); }
function inRange(year){ const f=parseDMY(val('d_from')), t=parseDMY(val('d_to')); if(!f||!t) return true; return year>=f.getFullYear()&&year<=t.getFullYear(); }

function safeIssns(w){
  const raw=w?.primary_location?.source?.issn;
  const arr=Array.isArray(raw)?raw:(raw?[raw]:[]);
  return arr.filter(x=>x&&typeof x==='string').map(x=>x.trim().toUpperCase());
}

function calcYears(startDate, endDate){
  if(!startDate||!endDate) return 0;
  const [sy,sm]=startDate.split('-').map(Number);
  const [ey,em]=endDate.split('-').map(Number);
  if(!sy||!sm||!ey||!em) return 0;
  const months=(ey-sy)*12+(em-sm)+1;
  return Math.max(0, Math.round(months/12*10)/10);
}

async function loadScimago(){
  if(scimagoData) return;
  try{ const r=await fetch('scimago_issn.json'); scimagoData=r.ok?await r.json():{}; }catch{ scimagoData={}; }
}
function getQ(issns){
  for(const issn of issns){ const q=scimagoData?.[issn.replace('-','')]; if(q) return q; }
  return null;
}

// ── Fetch ────────────────────────────────────────────
async function fetchAll(){
  const id=val('f_oaid').trim();
  if(!id){ setMsg('OpenAlex Author ID enter කරන්න'); return; }
  const authorId=id.startsWith('A')||id.startsWith('a')?id:'A'+id;
  setMsg('Scimago loading…'); await loadScimago();
  setMsg('Author profile…');
  try{
    const ar=await fetch(`https://api.openalex.org/authors/${authorId}?mailto=${MAILTO}`);
    if(!ar.ok) throw new Error('Author not found');
    const a=await ar.json();
    if(!a.id) throw new Error('Author not found');
    // Auto-fill citations from OpenAlex
    const oaCitations = a.cited_by_count || 0;
    const citCard = document.getElementById('f_citations_card');
    const citHid = document.getElementById('f_citations');
    if(citCard && !parseInt(citCard.value)) {
      citCard.value = oaCitations;
      if(citHid) citHid.value = oaCitations;
      const oaNote = document.getElementById('cit_oa_note');
      if(oaNote) oaNote.textContent = `OpenAlex: ${oaCitations} citations (auto-filled — verify with Google Scholar)`;
    }
    setMsg('Fetching publications…');
    let raw=[],page=1;
    while(true){
      const wr=await fetch(`https://api.openalex.org/works?filter=author.id:${authorId}&per-page=50&page=${page}&mailto=${MAILTO}`);
      const wd=await wr.json(); const res=wd.results||[];
      raw=raw.concat(res); if(res.length<50) break; page++;
    }
    const inPeriod=raw.filter(w=>inRange(w.publication_year));
    setMsg(`${inPeriod.length} papers in period — classifying…`);
    allJournals=[]; allConf=[]; allCitations=[];
    for(const w of inPeriod){
      const t=(w.type||'').toLowerCase();
      const issns=safeIssns(w);
      const q=getQ(issns);
      const indexedIn=(w.primary_location?.source?.indexed_in||[]).map(x=>x.toLowerCase());
      const isWos=indexedIn.includes('wos')||indexedIn.includes('scie')||indexedIn.includes('ssci')||indexedIn.includes('esci');
      const wosVal=isWos?'yes':'unknown';
      if(t==='article'||t==='journal-article'){
        allJournals.push({work:w,freq:'high',wos:wosVal,contrib:100,claimed:calcJournalPts({freq:'high',wos:wosVal,contrib:100}),q,issns});
      } else if(t==='proceedings-article'||t==='conference-paper'){
        allConf.push({work:w,type:'full',claimed:1});
      } else if(t==='book-chapter'||t==='book'){
        // Add directly to manual §2.2.1a (Recognized) — user can change via dropdown
        const pts=t==='book'?6:3;
        const title=w.display_name||'';
        if(!manualItems['s2_book_rec']) manualItems['s2_book_rec']=[];
        manualItems['s2_book_rec'].push({desc:title, pts, _work:w, evidence:{}});
      }
      // All papers → citations list
      const cit = w.cited_by_count||0;
      allCitations.push({title:w.display_name||'Untitled', year:w.publication_year||'', citations:cit, citOverride:false});
    }
    const bookCount=(manualItems['s2_book_rec']||[]).length+(manualItems['s2_book_oth']||[]).length;
    setMsg(`✅ ${allJournals.length} journals, ${allConf.length} conference, ${bookCount} books/chapters`);
    renderAll();
    document.getElementById('tilesRow').style.display='grid';
    document.getElementById('printBtn').style.display='block';
  }catch(e){ setMsg('❌ '+e.message,true); }
}
function setMsg(t,err=false){ const el=document.getElementById('loadMsg'); el.textContent=t; el.className='load-msg'+(err?' err':''); }

// ── Scoring ──────────────────────────────────────────
function calcJournalPts({freq,wos,contrib}){
  const base=freq==='high'?3:2;
  const indexed=wos==='yes'?2:0;
  return ((base+indexed)*(contrib/100));
}

function getSubTotal(id){
  return (manualItems[id]||[]).reduce((s,it)=>{
    if(id==='s2_trans_b' && !it.recognized) return s;
    return s+(parseFloat(it.pts)||0);
  },0);
}

function getManualTotal(group){
  // For s1_6, use combined cap via getSubSectionTotal
  const s1_6_ids=new Set(['s1_inst_a','s1_inst_b','s1_inst_c','s1_inst_d','s1_inst_e','s1_inst_f']);
  let s1_6_counted=false;
  return SUB_SECTIONS.filter(s=>s.group===group).reduce((sum,s)=>{
    if(s1_6_ids.has(s.id)){
      if(!s1_6_counted){ s1_6_counted=true; return sum+getSubSectionTotal('s1_6'); }
      return sum;
    }
    const raw=getSubTotal(s.id);
    return sum+(s.cap!=null?Math.min(raw,s.cap):raw);
  },0);
}

function recalc(){
  let s211=0;
  allJournals.forEach(e=>{ e.claimed=calcJournalPts({freq:e.freq,wos:e.wos,contrib:e.contrib}); s211+=e.claimed; });
  let confFull=0,confAbs=0,confPres=0;
  allConf.forEach(e=>{
    if(e.type==='full') confFull+=e.claimed;
    else if(e.type==='abstract') confAbs+=e.claimed;
    else confPres+=e.claimed;
  });
  confFull=Math.min(confFull,15); confAbs=Math.min(confAbs,5); confPres=Math.min(confPres,5);
  const s212=confFull+confAbs+confPres;
  // §2.1.3 citations — paper-by-paper, cap 10pts per paper (max 20 cit per paper)
  const s213=allCitations.length
    ? allCitations.reduce((t,c)=>t+Math.min(c.citations*0.5,10),0)
    : Math.min((parseInt(val('f_citations'))||0)*0.5,100);
  // Sync manual field for display
  if(allCitations.length){
    const total213=allCitations.reduce((t,c)=>t+c.citations,0);
    const citCard=document.getElementById('f_citations_card'); if(citCard) citCard.value=total213;
    document.getElementById('f_citations').value=total213;
  }
  const s1=getManualTotal('s1');
  const s2other=getManualTotal('s2other');
  const s2=s211+s212+s213+s2other;
  const s3=getManualTotal('s3');
  const total=s1+s2+s3;

  const setTile=(id,vid,v,m)=>{ const el=document.getElementById(vid); if(el) el.textContent=v.toFixed(1); const t=document.getElementById(id); if(t) t.className='tile '+(v>=m?'t-ok':'t-warn'); };
  const post=val('f_post');
  const min=MIN_MARKS[post]||MIN_MARKS.prof_merit;
  setTile('t1','tv1',s1,min.s1); setTile('t2','tv2',s2,min.s2); setTile('t3','tv3',s3,min.s3);
  setTile('ttot','tvtot',total,min.total); setTile('t211','tv211',s211,min.j211);


  document.getElementById('minReqs').innerHTML=`
    <div>§1 Teaching: ${s1.toFixed(1)} / <b>${min.s1}</b> ${s1>=min.s1?'✅':'❌'}</div>
    <div>§2 Research: ${s2.toFixed(1)} / <b>${min.s2}</b> ${s2>=min.s2?'✅':'❌'}</div>
    <div>§2.1.1 Journals: ${s211.toFixed(1)} / <b>${min.j211}</b> ${s211>=min.j211?'✅':'❌'}</div>
    <div>§3 University: ${s3.toFixed(1)} / <b>${min.s3}</b> ${s3>=min.s3?'✅':'❌'}</div>
    <div style="border-top:1px solid var(--border);margin-top:4px;padding-top:4px"><b>Total: ${total.toFixed(1)} / ${min.total}</b> ${total>=min.total?'✅':'❌'}</div>`;

  // Update ribbon pts in DOM
  const setRib=(id,v)=>{ const el=document.getElementById(id); if(el) el.textContent=v.toFixed(1)+' pts'; };
  setRib('ribpts_s1',s1); setRib('ribpts_s2',s2); setRib('ribpts_s3',s3);
  setRib('ribpts_s1_1',getSubSectionTotal('s1_1')); setRib('ribpts_s1_2',getSubSectionTotal('s1_2'));
  setRib('ribpts_s1_3',getSubSectionTotal('s1_3')); setRib('ribpts_s1_4',getSubSectionTotal('s1_4'));
  setRib('ribpts_s1_5',Math.min(getSubTotal('s1_cpd'),10)); setRib('ribpts_s1_6',getSubSectionTotal('s1_6')); setRib('ribpts_s1_7',Math.min(getSubTotal('s1_dual'),8));
  setRib('ribpts_s2_1',s211+s212+s213); setRib('ribpts_s2_2',getSubSectionTotal('s2_2'));
  setRib('ribpts_s2_3',Math.min(getSubTotal('s2_creative'),15)); setRib('ribpts_s2_4',getSubSectionTotal('s2_4'));
  setRib('ribpts_s3_1',getSubSectionTotal('s3_1')); setRib('ribpts_s3_2',Math.min(getSubTotal('s3_awards'),10));
  setRib('ribpts_s3_3',getSubSectionTotal('s3_3'));

  updatePrintCover(s1,s2,s211,s212,s213,s3,total);
}

function getSubSectionTotal(subKey){
  let sum=0;
  const subs=SUB_SECTIONS.filter(s=>s.sub===subKey);
  // §1.6: combined cap of 20 across all 6 sub-items
  if(subKey==='s1_6'){
    const raw=subs.reduce((t,s)=>t+getSubTotal(s.id),0);
    return Math.min(raw,20);
  }
  // §3.1 textbooks: s3_textbook_rec + s3_textbook_oth share combined cap of 18
  if(subKey==='s3_1'){
    const textbookTotal=Math.min(getSubTotal('s3_textbook_rec')+getSubTotal('s3_textbook_oth'),18);
    const others=subs.filter(s=>s.id!=='s3_textbook_rec'&&s.id!=='s3_textbook_oth');
    sum=textbookTotal+others.reduce((t,s)=>{ const raw=getSubTotal(s.id); return t+(s.cap!=null?Math.min(raw,s.cap):raw); },0);
    return sum;
  }
  return subs.reduce((t,s)=>{ const raw=getSubTotal(s.id); return t+(s.cap!=null?Math.min(raw,s.cap):raw); },0);
}

// ── Evidence for fetched items (journals/conf) ────────
function getFetchedEvFname(section, idx, title){
  const prefix=section==='journals'?'2.1.1':'2.1.2';
  const t=(title||'item').replace(/[^a-zA-Z0-9 ]/g,'').trim().replace(/\s+/g,'_').substring(0,20)||'item';
  return `${prefix}_${String(idx+1).padStart(2,'0')}_${t}.pdf`;
}
function attachFetchedEv(section, idx, input){
  const file=input.files[0]; if(!file) return;
  const arr=section==='journals'?allJournals:allConf;
  if(!arr[idx]) return;
  const reader=new FileReader();
  reader.onload=e=>{
    arr[idx].evidence={name:file.name, dataUrl:e.target.result};
    if(section==='journals') renderJournals(); else renderConf();
    const dot=document.getElementById('saveEvDot'); if(dot) dot.style.display='block';
  };
  reader.readAsDataURL(file);
}
async function clearFetchedEv(section, idx){
  const arr=section==='journals'?allJournals:allConf;
  const title=arr[idx]?.work?.display_name||'';
  const fname=getFetchedEvFname(section,idx,title);
  if(arr[idx]) arr[idx].evidence={};
  if(section==='journals') renderJournals(); else renderConf();
  if(fname && evidenceFolderHandle){
    const deleted=await deleteEvidenceFile(fname);
    showSaveNotice(deleted?`🗑️ Evidence deleted: ${fname}`:`✅ Removed from screen. File not found in folder.`, deleted?'ok':'warn');
  }
}
async function deleteFetchedItem(section, idx){
  const arr=section==='journals'?allJournals:allConf;
  const title=arr[idx]?.work?.display_name||'';
  const fname=getFetchedEvFname(section,idx,title);
  arr.splice(idx,1);
  renderAll();
  if(fname && evidenceFolderHandle){
    const deleted=await deleteEvidenceFile(fname);
    showSaveNotice(deleted?`🗑️ Item and evidence deleted: ${fname}`:`✅ Item removed.`, deleted?'ok':'warn');
  }
}
function fetchedEvCell(section, idx, ev){
  if(ev?.name && ev?.dataUrl)
    return `<td style="width:120px;font-size:.7rem"><span style="color:var(--accent);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px;display:block" onclick="openFetchedEv('${section}',${idx})" title="${esc(ev.name)}">📄 ${esc(ev.name)}</span><button class="del-btn" onclick="clearFetchedEv('${section}',${idx})">✕</button></td>`;
  return `<td style="width:90px"><label style="cursor:pointer;font-size:.7rem;color:var(--fg3);border:1px dashed var(--border);border-radius:4px;padding:2px 6px;white-space:nowrap;display:inline-block">📎 PDF<input type="file" accept=".pdf" style="display:none" onchange="attachFetchedEv('${section}',${idx},this)"></label></td>`;
}
function openFetchedEv(section, idx){
  const arr=section==='journals'?allJournals:allConf;
  const ev=arr[idx]?.evidence;
  if(!ev?.dataUrl) return;
  const w=window.open();
  w.document.write(`<iframe src="${ev.dataUrl}" style="width:100%;height:100vh;border:none"></iframe>`);
}

// ── Render conference ─────────────────────────────────
function renderConf(){
  if(!allConf.length){ document.getElementById('body_conf').innerHTML='<div class="empty-s">No conference papers yet</div>'; document.getElementById('foot_conf').textContent=''; document.getElementById('chip_conf').textContent='0 pts'; return; }
  let totalFull=0,totalAbs=0,totalPres=0;
  const rows=allConf.map((e,i)=>{
    const w=e.work||{}; const doi=(w.doi||'').replace('https://doi.org/','');
    const maxPts=e.type==='full'?1:e.type==='abstract'?0.75:0.5;
    const contrib=e.contrib??100;
    const claimed=parseFloat((maxPts*(contrib/100)).toFixed(2));
    if(e.claimed!==claimed){ e.claimed=claimed; }
    if(e.type==='full') totalFull+=e.claimed; else if(e.type==='abstract') totalAbs+=e.claimed; else totalPres+=e.claimed;
    return `<tr>
      <td style="text-align:center;color:var(--fg3);width:28px">${i+1}</td>
      <td class="td-pts" style="font-weight:700;color:var(--accent)">${e.claimed.toFixed(2)}</td>
      <td class="td-title"><input class="td-edit" value="${esc(w.display_name||'')}" oninput="allConf[${i}].work.display_name=this.value">${doi?`<br><a href="https://doi.org/${doi}" target="_blank" style="color:var(--accent);font-size:.65rem">↗ ${doi}</a>`:''}</td>
      <td style="font-size:.78rem">${esc(w.primary_location?.source?.display_name||'—')}<br><span style="color:var(--fg3);font-size:.7rem">${w.publication_year||''}</span></td>
      <td><select style="font-size:.75rem;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--fg);padding:2px" onchange="allConf[${i}].type=this.value;allConf[${i}].claimed=(this.value==='full'?1:this.value==='abstract'?0.75:0.5)*((allConf[${i}].contrib??100)/100);renderConf();recalc()"><option value="full" ${e.type==='full'?'selected':''}>Full (1 pt)</option><option value="abstract" ${e.type==='abstract'?'selected':''}>Abstract (0.75 pt)</option><option value="presented" ${e.type==='presented'?'selected':''}>Presented (0.5 pt)</option></select></td>
      <td><input class="contrib-in" type="number" value="${contrib}" min="1" max="100" style="width:52px" title="Contribution %" onchange="allConf[${i}].contrib=parseFloat(this.value)||100;allConf[${i}].claimed=(allConf[${i}].type==='full'?1:allConf[${i}].type==='abstract'?0.75:0.5)*(parseFloat(this.value)||100)/100;renderConf();recalc()">%</td>
      ${fetchedEvCell('conf',i,e.evidence)}
      <td><select class="move-sel" title="Move to" onchange="moveWork2(${i},'conf',this.value);this.value=''"><option value="">→</option><option value="journals">§2.1.1 Journals</option><option value="book_rec">§2.2.1a Books(Rec)</option><option value="book_oth">§2.2.1b Books(Other)</option></select></td>
      <td><button class="del-btn" onclick="deleteFetchedItem('conf',${i})">✕</button></td>
    </tr>`;
  }).join('');
  document.getElementById('body_conf').innerHTML=`<table><tr><th>#</th><th>Pts</th><th>Title</th><th>Conference</th><th>Type</th><th style="width:52px">Contrib%</th><th style="width:90px">Evidence PDF</th><th></th><th></th></tr>${rows}</table>`;
  const s212=Math.min(totalFull,15)+Math.min(totalAbs,5)+Math.min(totalPres,5);
  document.getElementById('foot_conf').textContent=`Full: ${totalFull.toFixed(2)} (max 15) · Abstract: ${totalAbs.toFixed(2)} (max 5) · Presented: ${totalPres.toFixed(2)} (max 5)`;
  document.getElementById('chip_conf').textContent=s212.toFixed(1)+' pts';
}

// ── Move between §2 sections ──────────────────────────
async function moveWork2(idx, fromSection, toSection){
  if(!toSection) return;
  let title='', w=null, ev={}, oldFname=null;
  if(fromSection==='journals'){
    const e=allJournals[idx]; w=e?.work; title=w?.display_name||''; ev=e?.evidence||{};
    if(ev?.dataUrl) oldFname=getFetchedEvFname('journals',idx,title);
    allJournals.splice(idx,1);
  } else if(fromSection==='conf'){
    const e=allConf[idx]; w=e?.work; title=w?.display_name||''; ev=e?.evidence||{};
    if(ev?.dataUrl) oldFname=getFetchedEvFname('conf',idx,title);
    allConf.splice(idx,1);
  } else if(fromSection==='book_rec'||fromSection==='book_oth'){
    const key='s2_'+fromSection;
    const items=manualItems[key]||[];
    const e=items[idx]; title=e?.desc||''; w=e?._work||null; ev=e?.evidence||{};
    if(ev?.dataUrl) oldFname=getEvidenceFname(key,idx);
    items.splice(idx,1);
  }
  if(toSection==='journals'){
    const issns=safeIssns(w||{});
    const q=getQ(issns);
    const indexedIn=(w?.primary_location?.source?.indexed_in||[]).map(x=>x.toLowerCase());
    const isWos=indexedIn.some(x=>['wos','scie','ssci','esci'].includes(x));
    allJournals.push({work:w||{id:'mv_'+Date.now(),display_name:title,doi:null,type:'article',publication_year:new Date().getFullYear(),primary_location:{source:{display_name:'',issn:[],indexed_in:[]}}},freq:'high',wos:isWos?'yes':'unknown',contrib:100,claimed:3,q,issns,evidence:ev});
  } else if(toSection==='conf'){
    allConf.push({work:w||{id:'mv_'+Date.now(),display_name:title,doi:null,type:'proceedings-article',publication_year:new Date().getFullYear(),primary_location:{source:{display_name:'',issn:[]}}},type:'full',claimed:1,evidence:ev});
  } else if(toSection==='book_rec'||toSection==='book_oth'){
    const key='s2_'+toSection;
    if(!manualItems[key]) manualItems[key]=[];
    // use section default pts on move — user adjusts contrib% if needed
    const defPts=toSection==='book_rec'?3:1;
    manualItems[key].push({desc:title, pts:defPts, basePts:defPts, contrib:100, _work:w, evidence:ev});
  }
  // Delete old evidence file from folder (new name saved on next Save)
  if(oldFname && evidenceFolderHandle){
    await deleteEvidenceFile(oldFname);
  }
  renderAll();
  markUnsaved();
}

// ── Manual sub-section card ───────────────────────────
function renderSubCard(s){
  if(!manualItems[s.id]) manualItems[s.id]=[];
  const items=manualItems[s.id];
  const isDate=!!DATE_BASED[s.id];
  const subtotal=getSubTotal(s.id);
  const capped=s.cap!=null&&subtotal>s.cap;
  const displayTotal=s.cap!=null?Math.min(subtotal,s.cap):subtotal;

  let rows='';
  const evCell=(it,n)=>it.evidence?.name
    ?`<td style="width:120px;font-size:.7rem"><span style="color:var(--accent);cursor:pointer;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px" onclick="openEvidence('${s.id}',${n})" title="${esc(it.evidence.name)}">📄 ${esc(it.evidence.name)}</span><button class="del-btn" onclick="clearEvidence('${s.id}',${n})" title="Remove evidence">✕</button></td>`
    :`<td style="width:90px"><label style="cursor:pointer;font-size:.7rem;color:var(--fg3);border:1px dashed var(--border);border-radius:4px;padding:2px 6px;white-space:nowrap;display:inline-block">📎 PDF<input type="file" accept=".pdf" style="display:none" onchange="attachEvidence('${s.id}',${n},this)"></label></td>`;

  if(isDate){
    const db=DATE_BASED[s.id];
    rows=items.map((it,n)=>`<tr>
      <td style="color:var(--fg3);width:24px;text-align:center">${n+1}</td>
      <td style="display:flex;align-items:center;gap:3px">
        <input type="number" value="${parseFloat(it.pts)||0}" min="0" step="0.5" style="width:52px;font-size:.78rem;text-align:center;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--accent);font-weight:700;padding:2px 3px"
          oninput="manualItems['${s.id}'][${n}].pts=parseFloat(this.value)||0;manualItems['${s.id}'][${n}].ptsOverride=true;recalc();renderManualSections()">
        <button class="reset-btn" title="Recalculate from dates" onclick="manualItems['${s.id}'][${n}].ptsOverride=false;autoCalcPts('${s.id}',${n},${db.rate});renderManualSections()">↺</button>
      </td>
      <td><input type="month" class="date-in" value="${it.startDate||''}" title="Start" onchange="manualItems['${s.id}'][${n}].startDate=this.value;autoCalcPts('${s.id}',${n},${db.rate});renderManualSections()"></td>
      <td><input type="month" class="date-in" value="${it.endDate||''}" title="End" onchange="manualItems['${s.id}'][${n}].endDate=this.value;autoCalcPts('${s.id}',${n},${db.rate});renderManualSections()"></td>
      <td style="text-align:center;font-size:.75rem;color:var(--fg2)">${(it.years||0).toFixed(1)} yr</td>
      <td><input class="td-edit" value="${esc(it.desc||'')}" style="font-size:.78rem;width:100%;${!(it.desc||'').trim()?'border-color:#f59e0b;':''}" oninput="manualItems['${s.id}'][${n}].desc=this.value;markUnsaved()" placeholder="Description *" title="Description required to save"></td>
      ${evCell(it,n)}
      <td><button class="del-btn" onclick="deleteItemWithEvidence('${s.id}',${n})">✕</button></td>
    </tr>`).join('');
  } else {
    const isTransB = s.id==='s2_trans_b';
    const isBook2 = s.id==='s2_book_rec'||s.id==='s2_book_oth';
    const bookMoveSel=(sid,n)=>sid==='s2_book_rec'
      ?`<td><select class="move-sel" title="Move to" onchange="moveWork2(${n},'book_rec',this.value);this.value=''"><option value="">→</option><option value="journals">§2.1.1 Journals</option><option value="conf">§2.1.2 Conf</option><option value="book_oth">§2.2.1b Other</option></select></td>`
      :`<td><select class="move-sel" title="Move to" onchange="moveWork2(${n},'book_oth',this.value);this.value=''"><option value="">→</option><option value="journals">§2.1.1 Journals</option><option value="conf">§2.1.2 Conf</option><option value="book_rec">§2.2.1a Rec</option></select></td>`;
    rows=items.map((it,n)=>{
      const contrib=it.contrib!=null?it.contrib:100;
      const basePts=it.basePts!=null?it.basePts:(parseFloat(it.pts)||s.def);
      if(isBook2){ it.pts=parseFloat((basePts*(contrib/100)).toFixed(2)); }
      const ptsCell=isBook2
        ?('<input type="number" value="'+basePts+'" min="0" step="0.5" style="width:52px;font-size:.78rem;text-align:center;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--accent);font-weight:700;padding:2px 3px" title="Base pts" oninput="manualItems[\''+s.id+'\']['+n+'].basePts=parseFloat(this.value)||0;manualItems[\''+s.id+'\']['+n+'].pts=manualItems[\''+s.id+'\']['+n+'].basePts*((manualItems[\''+s.id+'\']['+n+'].contrib!=null?manualItems[\''+s.id+'\']['+n+'].contrib:100)/100);recalc();renderManualSections()">')
        :('<input type="number" value="'+(parseFloat(it.pts)||0)+'" min="0" step="0.5" style="width:52px;font-size:.78rem;text-align:center;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--accent);font-weight:700;padding:2px 3px" oninput="manualItems[\''+s.id+'\']['+n+'].pts=parseFloat(this.value)||0;recalc();renderManualSections()">');
      const contribCell=isBook2
        ?('<td><input class="contrib-in" type="number" value="'+contrib+'" min="1" max="100" style="width:52px" title="Contribution %" oninput="manualItems[\''+s.id+'\']['+n+'].contrib=parseFloat(this.value)||100;manualItems[\''+s.id+'\']['+n+'].pts=(manualItems[\''+s.id+'\']['+n+'].basePts!=null?manualItems[\''+s.id+'\']['+n+'].basePts:'+s.def+')*(parseFloat(this.value)||100)/100;recalc();renderManualSections()">%</td>')
        :'';
      const descBorder=(it.desc||'').trim()?'':'border-color:#f59e0b;';
      const transCell=isTransB?('<td style="width:100px;text-align:center"><label style="font-size:.72rem;cursor:pointer;display:flex;align-items:center;gap:3px;justify-content:center"><input type="checkbox" '+(it.recognized?'checked':'')+' onchange="manualItems[\''+s.id+'\']['+n+'].recognized=this.checked;recalc();renderManualSections()"> Recognized</label></td>'):'';
      return '<tr>'
        +'<td style="color:var(--fg3);width:24px;text-align:center">'+(n+1)+'</td>'
        +'<td class="td-pts">'+ptsCell+'</td>'
        +'<td><input class="td-edit" value="'+esc(it.desc||'')+'" style="font-size:.78rem;width:100%;'+descBorder+'" oninput="manualItems[\''+s.id+'\']['+n+'].desc=this.value;markUnsaved()" placeholder="Description *" title="Description required to save"></td>'
        +transCell
        +contribCell
        +evCell(it,n)
        +(isBook2?bookMoveSel(s.id,n):'')
        +'<td><button class="del-btn" onclick="deleteItemWithEvidence(\''+s.id+'\','+n+')">✕</button></td>'
        +'</tr>';
    }).join('');
  }

  const isTransB = s.id==='s2_trans_b';
  const isBook = s.id==='s2_book_rec'||s.id==='s2_book_oth';
  const thead=isDate
    ?`<tr><th style="width:24px">#</th><th style="width:90px">Pts</th><th>Start</th><th>End</th><th>Yrs</th><th>Description</th><th style="width:90px">Evidence PDF</th><th style="width:24px"></th></tr>`
    :isTransB
    ?`<tr><th style="width:24px">#</th><th style="width:60px">Pts</th><th>Description</th><th style="width:100px">Recognized?</th><th style="width:90px">Evidence PDF</th><th style="width:24px"></th></tr>`
    :isBook
    ?`<tr><th style="width:24px">#</th><th style="width:60px">Base Pts</th><th>Description</th><th style="width:60px">Contrib%</th><th style="width:90px">Evidence PDF</th><th style="width:30px"></th><th style="width:24px"></th></tr>`
    :`<tr><th style="width:24px">#</th><th style="width:60px">Pts</th><th>Description</th><th style="width:90px">Evidence PDF</th><th style="width:24px"></th></tr>`;

  const addFn=isDate
    ?`if(!manualItems['${s.id}'])manualItems['${s.id}']=[];manualItems['${s.id}'].push({desc:'',pts:0,startDate:'',endDate:'',years:0,ptsOverride:false});recalc();renderManualSections()`
    :isTransB
    ?`if(!manualItems['${s.id}'])manualItems['${s.id}']=[];manualItems['${s.id}'].push({desc:'',pts:${s.def},recognized:false});recalc();renderManualSections()`
    :`if(!manualItems['${s.id}'])manualItems['${s.id}']=[];manualItems['${s.id}'].push({desc:'',pts:${s.def}});recalc();renderManualSections()`;

  return `<div class="pub-sec" style="margin-bottom:4px">
    <div class="psec-hdr" onclick="toggleSec(this)">
      <div class="psec-l">
        <span class="pts-chip">${displayTotal.toFixed(1)} pts${capped?' ⚠️':''}</span>

          <div class="psec-title">${s.label}</div>
          <div class="psec-sub">${s.cap!=null?'Max '+s.cap+' pts · ':''} default ${s.def} pts/item${isDate?' · auto from dates':''}</div>

function autoCalcPts(id, n, rate){
  const it=manualItems[id]?.[n]; if(!it) return;
  if(it.ptsOverride) return;
  const yrs=calcYears(it.startDate, it.endDate);
  it.years=yrs;
  it.pts=Math.round(rate*yrs*10)/10;
  recalc();
}

// ── Add journal by DOI ────────────────────────────────
async function addJournalByDoi(){
  const raw=val('j_doi').trim().replace(/^https?:\/\/doi\.org\//,'');
  if(!raw) return;
  const msgEl=document.getElementById('j_doi_msg'); msgEl.textContent='Fetching…';
  await loadScimago();
  try{
    const r=await fetch(`https://api.openalex.org/works/doi:${raw}?mailto=${MAILTO}`);
    if(!r.ok) throw new Error('Not found in OpenAlex');
    const w=await r.json(); if(!w.id) throw new Error('Not found');
    const issns=safeIssns(w); const q=getQ(issns);
    document.getElementById('j_title').value=w.display_name||'';
    document.getElementById('j_authors').value=(w.authorships||[]).map(a=>a.author?.display_name||'').filter(Boolean).join(', ');
    document.getElementById('j_year').value=w.publication_year||'';
    document.getElementById('j_venue').value=w.primary_location?.source?.display_name||'';
    document.getElementById('j_issn').value=issns[0]||'';
    const indexed=(w.primary_location?.source?.indexed_in||[]).map(x=>x.toLowerCase());
    const isWos=indexed.some(x=>['wos','scie','ssci','esci'].includes(x));
    document.getElementById('j_wos').value=isWos?'yes':'unknown';
    msgEl.textContent=`✅ Filled from OpenAlex${q?' · '+q:''}${isWos?' · WoS ✓':''}`; msgEl.style.color='var(--accent)';
  }catch(e){ msgEl.textContent='⚠️ '+e.message+' — fill manually'; msgEl.style.color='var(--fg3)'; }
}

function addJournalManual(){
  const title=val('j_title').trim();

  const issns=val('j_issn')?[val('j_issn').trim().toUpperCase()]:[];

  const work={id:'j_'+Date.now(),doi:null,display_name:title,type:'article',publication_year:parseInt(val('j_year'))||new Date().getFullYear(),cited_by_count:0,_authors_str:val('j_authors'),primary_location:{source:{display_name:val('j_venue'),homepage_url:null,issn:issns.map(i=>i.slice(0,4)+'-'+i.slice(4)),type:'journal',indexed_in:[]}}};
  allJournals.push({work,freq:val('j_freq'),wos:val('j_wos'),contrib:parseFloat(val('j_contrib'))||100,q,issns});

// ── Per-item PDF evidence ─────────────────────────────
function attachEvidence(listId, idx, input){
  const file=input.files[0]; if(!file) return;
  if(!manualItems[listId]||!manualItems[listId][idx]) return;
  const reader=new FileReader();
  reader.onload=e=>{
    if(!manualItems[listId][idx].evidence) manualItems[listId][idx].evidence={};
    manualItems[listId][idx].evidence={name:file.name, dataUrl:e.target.result};
    renderManualSections(); recalc();
    const dot=document.getElementById('saveEvDot'); if(dot) dot.style.display='block';
  };
  reader.readAsDataURL(file);
}
function getEvidenceFname(listId, idx){
  const item = manualItems[listId]?.[idx]; if(!item) return null;
  const sub = SUB_LABEL[listId]||listId;
  const titlePart = (item.desc||'item').replace(/[^a-zA-Z0-9 ]/g,'').trim().replace(/\s+/g,'_').substring(0,20)||'item';
  return `${sub}_${String(idx+1).padStart(2,'0')}_${titlePart}.pdf`;
}

async function deleteEvidenceFile(fname){
  if(!evidenceFolderHandle||!fname) return false;
  try{ await evidenceFolderHandle.removeEntry(fname); return true; }catch{ return false; }
}

async function clearEvidence(listId, idx){
  const fname = getEvidenceFname(listId, idx);
  if(manualItems[listId]?.[idx]) manualItems[listId][idx].evidence={name:'',dataUrl:''};
  renderManualSections(); recalc();
  if(fname && evidenceFolderHandle){
    const deleted = await deleteEvidenceFile(fname);
    showSaveNotice(deleted ? `🗑️ Evidence file deleted from folder: ${fname}` : `✅ Removed from screen. File not found in folder.`, deleted?'ok':'warn');
  }
}

async function deleteItemWithEvidence(listId, idx){
  const fname = getEvidenceFname(listId, idx);
  manualItems[listId].splice(idx,1);
  recalc(); renderManualSections();
  if(fname && evidenceFolderHandle){
    const deleted = await deleteEvidenceFile(fname);
    showSaveNotice(deleted ? `🗑️ Item and evidence file deleted: ${fname}` : `✅ Item removed. Evidence file not found in folder.`, deleted?'ok':'warn');
  }
}
function openEvidence(listId, idx){
  const ev=manualItems[listId]?.[idx]?.evidence;
  if(!ev?.dataUrl) return;
  const w=window.open();
  w.document.write(`<iframe src="${ev.dataUrl}" style="width:100%;height:100vh;border:none"></iframe>`);
}

// ── Save evidence PDFs to folder ──────────────────────
let evidenceFolderHandle=null;

function buildSaveList(){
  const toSave=[], skipped=[];
  // Manual items
  for(const s of SUB_SECTIONS){
    const items=manualItems[s.id]||[];
    const sub=SUB_LABEL[s.id]||s.id;
    items.forEach((item,i)=>{
      if(!item.evidence?.dataUrl) return;
      if(!(item.desc||'').trim()){ skipped.push({label:`§${sub} item ${i+1}`, fname:item.evidence.name||''}); return; }
      const titlePart=(item.desc||'item').replace(/[^a-zA-Z0-9 ]/g,'').trim().replace(/\s+/g,'_').substring(0,20)||'item';
      const fname=`${sub}_${String(i+1).padStart(2,'0')}_${titlePart}.pdf`;
      toSave.push({fname, dataUrl:item.evidence.dataUrl});
    });
  }
  // Fetched journals evidence
  allJournals.forEach((e,i)=>{
    if(!e.evidence?.dataUrl) return;
    const title=e.work?.display_name||'item';
    toSave.push({fname:getFetchedEvFname('journals',i,title), dataUrl:e.evidence.dataUrl});
  });
  // Fetched conf evidence
  allConf.forEach((e,i)=>{
    if(!e.evidence?.dataUrl) return;
    const title=e.work?.display_name||'item';
    toSave.push({fname:getFetchedEvFname('conf',i,title), dataUrl:e.evidence.dataUrl});
  });
  if(citFileData?.dataUrl) toSave.push({fname:'2.1.3_citations_evidence.pdf', dataUrl:citFileData.dataUrl});
  return {toSave, skipped};
}

async function writeSingleFile(fname, dataUrl, override=false){
  if(!evidenceFolderHandle) return;
  if(!override){
    let exists=false;
    try{ await evidenceFolderHandle.getFileHandle(fname); exists=true; }catch{}
    if(exists) return 'exists';
  }
  const fh=await evidenceFolderHandle.getFileHandle(fname,{create:true});
  const wr=await fh.createWritable();
  const blob=await fetch(dataUrl).then(r=>r.blob());
  await wr.write(blob); await wr.close();
  return 'saved';
}

async function overrideFile(fname, dataUrl){
  if(!evidenceFolderHandle){ alert('Select a folder first — click 📁 Save Evidence'); return; }
  const result=await writeSingleFile(fname, dataUrl, true);
  if(result==='saved') showSaveNotice(`✅ Overridden: ${fname}`, 'ok');
}

function showSaveNotice(msg, type='ok'){
  let el=document.getElementById('saveNotice');
  if(!el){ el=document.createElement('div'); el.id='saveNotice';
    el.style.cssText='position:fixed;bottom:16px;right:16px;z-index:9999;max-width:420px;padding:12px 16px;border-radius:10px;font-size:.8rem;box-shadow:0 4px 20px rgba(0,0,0,.15);line-height:1.5';
    document.body.appendChild(el); }
  el.style.background=type==='ok'?'var(--green-bg)':'var(--amber-bg)';
  el.style.color=type==='ok'?'var(--green)':'var(--amber)';
  el.style.border=`1px solid ${type==='ok'?'var(--green-border)':'#f59e0b'}`;
  el.innerHTML=msg+'<button onclick="this.parentElement.remove()" style="float:right;background:none;border:none;cursor:pointer;font-size:1rem;line-height:1;margin-left:8px">✕</button>';
}

async function saveEvidenceFiles(){
  const {toSave, skipped}=buildSaveList();
  if(!toSave.length && !skipped.length){ showSaveNotice('⚠️ No evidence PDFs attached yet.','warn'); return; }
  if(!toSave.length && skipped.length){ showSaveNotice(`⚠️ Skipped ${skipped.length} item(s) with no description — add descriptions and save again.`,'warn'); return; }
  if(!window.showDirectoryPicker){
    toSave.forEach(f=>{ const a=document.createElement('a'); a.href=f.dataUrl; a.download=f.fname; a.click(); });
    return;
  }
  try{
    if(!evidenceFolderHandle) evidenceFolderHandle=await window.showDirectoryPicker({mode:'readwrite'});
    const existing=[], saved=[];
    for(const f of toSave){
      const result=await writeSingleFile(f.fname, f.dataUrl, false);
      if(result==='exists') existing.push(f);
      else saved.push(f.fname);
    }
    let html='';
    if(saved.length) html+=`<div>✅ Saved ${saved.length} file(s)</div>`;
    if(existing.length) html+=`<div style="margin-top:4px">Already saved — skipped ${existing.length} file(s). To replace: click ✕ on the evidence, upload the new file, then save again.</div>`;
    if(skipped.length) html+=`<div style="margin-top:4px">⚠️ Skipped ${skipped.length} item(s) with no description — add descriptions and save again.</div>`;
    showSaveNotice(html, (existing.length||skipped.length)?'warn':'ok');
    if(!existing.length && !skipped.length){ const dot=document.getElementById('saveEvDot'); if(dot) dot.style.display='none'; }
  }catch(e){
    if(e.name==='AbortError') return;
    toSave.forEach(f=>{ const a=document.createElement('a'); a.href=f.dataUrl; a.download=f.fname; a.click(); });
  }
}

// ── Citation evidence ─────────────────────────────────
let citFileData = null; // {name, dataUrl}
let citLinks = []; // [{source, label, url}]

const SOURCE_LABELS = {gs:'Google Scholar', scopus:'Scopus', wos:'Web of Science', other:'Other'};

function addCitLink(){
  const url = document.getElementById('cit_profile_url')?.value?.trim();
  if(!url){ return; }
  const src = document.getElementById('cit_source')?.value || 'gs';
  citLinks.push({source: src, label: SOURCE_LABELS[src]||src, url});
  document.getElementById('cit_profile_url').value = '';
  renderCitLinks();
}

function removeCitLink(i){
  citLinks.splice(i,1);
  renderCitLinks();
}

function renderCitLinks(){
  const el = document.getElementById('cit_links_list'); if(!el) return;
  if(!citLinks.length){ el.innerHTML=''; return; }
  el.innerHTML = citLinks.map((l,i)=>`
    <div style="display:flex;align-items:center;gap:6px;margin-top:4px;padding:4px 8px;background:var(--surface2);border-radius:6px;border:1px solid var(--border)">
      <span style="font-size:.7rem;font-weight:600;color:var(--fg2);white-space:nowrap">${l.label}</span>
      <a href="${l.url}" target="_blank" style="flex:1;font-size:.72rem;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${l.url}">${l.url}</a>
      <button onclick="removeCitLink(${i})" style="background:none;border:none;color:var(--fg3);cursor:pointer;font-size:.8rem;padding:0 2px">✕</button>
    </div>`).join('');
}

const CIT_SOURCE_URLS = {
  gs: 'https://scholar.google.com',
  scopus: 'https://www.scopus.com',
  wos: 'https://mjl.clarivate.com',
  other: '#'
};

function updateCitLink(){
  const url = val('cit_profile_url').trim();
  const src = val('cit_source');
  const link = document.getElementById('cit_source_link');
  if(!link) return;
  link.href = url || CIT_SOURCE_URLS[src] || '#';
  link.textContent = url ? '🔗 Open Profile' : '🔗 Open';
}

document.addEventListener('change', e => {
  if(e.target.id === 'cit_source') updateCitLink();
});

function handleCitFile(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    citFileData = {name: file.name, dataUrl: e.target.result};
    document.getElementById('cit_file_name').textContent = '📄 ' + file.name;
    document.getElementById('cit_file_clear').style.display = 'inline';
  };
  reader.readAsDataURL(file);
}

function clearCitFile(){
  citFileData = null;
  document.getElementById('cit_file_name').textContent = '';
  document.getElementById('cit_file_clear').style.display = 'none';
  document.getElementById('cit_file_in').value = '';
}

function openCitFile(){
  if(!citFileData) return;
  const w = window.open();
  w.document.write(`<iframe src="${citFileData.dataUrl}" style="width:100%;height:100vh;border:none"></iframe>`);
}

// ── Save / Load ───────────────────────────────────────
function exportJSON(){
  const data={
    f_name:val('f_name'),f_desig:val('f_desig'),f_dept:val('f_dept'),
    f_inst:val('f_inst'),f_post:val('f_post'),f_oaid:val('f_oaid'),
    d_from:val('d_from'),d_to:val('d_to'),f_citations:val('f_citations'),
    journals:allJournals.map(e=>({...e,work:{id:e.work.id,doi:e.work.doi,display_name:e.work.display_name,type:e.work.type,publication_year:e.work.publication_year,cited_by_count:e.work.cited_by_count,_authors_str:e.work._authors_str||'',primary_location:{source:{display_name:e.work.primary_location?.source?.display_name,issn:e.work.primary_location?.source?.issn,type:e.work.primary_location?.source?.type,indexed_in:e.work.primary_location?.source?.indexed_in||[]}}}})),
    conf:allConf.map(e=>({...e,work:{id:e.work.id,doi:e.work.doi,display_name:e.work.display_name,type:e.work.type,publication_year:e.work.publication_year,cited_by_count:e.work.cited_by_count,_authors_str:e.work._authors_str||'',primary_location:{source:{display_name:e.work.primary_location?.source?.display_name,issn:[],type:e.work.primary_location?.source?.type}}}})),
    books:[], // legacy — books now in manualItems['s2_book_rec'/'s2_book_oth']
    citations:allCitations,
    manualItems:Object.fromEntries(Object.entries(manualItems).map(([k,arr])=>[k,(arr||[]).filter(it=>(it.desc||'').trim())])),
    citFile:citFileData,
    citSource:val('cit_source'),
    citProfileUrl:val('cit_profile_url'),
    citLinks:citLinks,
  };
  const name=(val('f_name')||'applicant').replace(/[^a-z0-9]/gi,'_').toLowerCase();
  return {data, name, blob: new Blob([JSON.stringify(data,null,2)],{type:'application/json'})};
}

async function saveAll(){
  const {data, name, blob} = exportJSON();
  const fname = `ugc_${name}.json`;

  if(!window.showDirectoryPicker){
    // Fallback: download JSON only
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname; a.click();
    return;
  }
  try{
    if(!evidenceFolderHandle) evidenceFolderHandle=await window.showDirectoryPicker({mode:'readwrite'});

    // Save JSON (always override)
    const jfh=await evidenceFolderHandle.getFileHandle(fname,{create:true});
    const jwr=await jfh.createWritable();
    await jwr.write(blob); await jwr.close();

    // Save evidence PDFs
    const {toSave, skipped}=buildSaveList();
    const existing=[], saved=[];
    for(const f of toSave){
      let exists=false;
      try{ await evidenceFolderHandle.getFileHandle(f.fname); exists=true; }catch{}
      if(exists){ existing.push(f); continue; }
      const fh=await evidenceFolderHandle.getFileHandle(f.fname,{create:true});
      const wr=await fh.createWritable();
      const evblob=await fetch(f.dataUrl).then(r=>r.blob());
      await wr.write(evblob); await wr.close();
      saved.push(f.fname);
    }

    const lines=[];
    lines.push(`✅ JSON saved: <b>${fname}</b>`);
    saved.forEach(f=>lines.push(`✅ Saved: <b>${f}</b>`));
    if(existing.length){
      lines.push(`<div style="margin-top:6px;border-top:1px solid currentColor;padding-top:5px;font-weight:600">Already saved — skipped:</div>`);
      existing.forEach(f=>{ lines.push(`• <b>${f.fname}</b><div style="font-size:.71rem;opacity:.8;margin-left:8px">To replace: click ✕ on the evidence for that item, upload the new file, then save again.</div>`); });
    }
    if(skipped.length){
      lines.push(`<div style="margin-top:6px;border-top:1px solid currentColor;padding-top:5px;font-weight:600">Skipped (no description):</div>`);
      skipped.forEach(s=>{ lines.push(`• <b>${s.label}</b> — add a description first, then save again.`); });
    }
    showSaveNotice(lines.join('<br>'), existing.length||skipped.length?'warn':'ok');
    const dot=document.getElementById('saveEvDot'); if(dot&&!existing.length) dot.style.display='none';
  }catch(e){
    if(e.name==='AbortError') return;
    // Fallback
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname; a.click();
  }
}

function importJSON(input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      ['f_name','f_desig','f_dept','f_inst','f_post','f_oaid','d_from','d_to','f_citations'].forEach(id=>{ if(d[id]!==undefined){const el=document.getElementById(id);if(el)el.value=d[id];}});
      allJournals=d.journals||[]; allConf=d.conf||[]; allCitations=d.citations||[];
      // Legacy: if books saved in old format, migrate to manualItems
      if(d.books?.length && !d.manualItems?.s2_book_rec?.length && !d.manualItems?.s2_book_oth?.length){
        const legacy=d.books||[];
        if(!d.manualItems) d.manualItems={};
        d.manualItems['s2_book_rec']=[...(d.manualItems['s2_book_rec']||[]),...legacy.filter(b=>b.subType==='book_rec').map(b=>({desc:b.work?.display_name||b.desc||'',pts:b.pts,evidence:{}}))];
        d.manualItems['s2_book_oth']=[...(d.manualItems['s2_book_oth']||[]),...legacy.filter(b=>b.subType!=='book_rec').map(b=>({desc:b.work?.display_name||b.desc||'',pts:b.pts,evidence:{}}))];
      }
      if(d.manualItems) manualItems=d.manualItems; else manualItems={};
      renderManualSections();
      const citCard=document.getElementById('f_citations_card');
      if(citCard) citCard.value=d.f_citations||0;
      // Restore citation evidence
      if(d.citFile && d.citFile.name){
        citFileData=d.citFile;
        const fn=document.getElementById('cit_file_name');
        const fc=document.getElementById('cit_file_clear');
        if(fn) fn.textContent='📄 '+d.citFile.name;
        if(fc) fc.style.display='inline';
      }
      if(d.citSource){ const el=document.getElementById('cit_source'); if(el) el.value=d.citSource; }
      if(d.citProfileUrl){ const el=document.getElementById('cit_profile_url'); if(el) el.value=d.citProfileUrl; }
      if(d.citLinks) citLinks=d.citLinks; else citLinks=[];
      updateCitLink(); renderCitLinks();
      updateHeader();
      document.getElementById('tilesRow').style.display='grid';
      document.getElementById('printBtn').style.display='block';
      // Show re-link button after JSON load
      const rb=document.getElementById('relinkBtn'); if(rb) rb.style.display='';
    }catch(e){ alert('Invalid JSON file: '+e.message); }
  };
  reader.readAsText(file); input.value='';
}

// ── Re-link evidence from folder after JSON load ──────
async function relinkEvidenceFolder(){
  if(!window.showDirectoryPicker){ showSaveNotice('⚠️ File System Access API not supported in this browser.','warn'); return; }
  try{
    if(!evidenceFolderHandle) evidenceFolderHandle=await window.showDirectoryPicker({mode:'read'});
    let linked=0, missing=[];

    // Helper: try to read a file from folder as dataUrl
    const readFile=async(fname)=>{
      try{
        const fh=await evidenceFolderHandle.getFileHandle(fname);
        const file=await fh.getFile();
        return await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=e=>res(e.target.result); r.onerror=rej; r.readAsDataURL(file); });
      }catch{ return null; }
    };

    // Manual items
    for(const s of SUB_SECTIONS){
      const items=manualItems[s.id]||[];
      for(let i=0;i<items.length;i++){
        if(items[i].evidence?.dataUrl) continue; // already linked
        const fname=getEvidenceFname(s.id,i);
        if(!fname) continue;
        const dataUrl=await readFile(fname);
        if(dataUrl){ items[i].evidence={name:fname, dataUrl}; linked++; }
        else if(items[i].evidence?.name) missing.push(fname);
      }
    }
    // Fetched journals
    for(let i=0;i<allJournals.length;i++){
      if(allJournals[i].evidence?.dataUrl) continue;
      const fname=getFetchedEvFname('journals',i,allJournals[i].work?.display_name||'');
      const dataUrl=await readFile(fname);
      if(dataUrl){ allJournals[i].evidence={name:fname, dataUrl}; linked++; }
    }
    // Fetched conf
    for(let i=0;i<allConf.length;i++){
      if(allConf[i].evidence?.dataUrl) continue;
      const fname=getFetchedEvFname('conf',i,allConf[i].work?.display_name||'');
      const dataUrl=await readFile(fname);
      if(dataUrl){ allConf[i].evidence={name:fname, dataUrl}; linked++; }
    }
    // Citation evidence
    if(!citFileData?.dataUrl){
      const dataUrl=await readFile('2.1.3_citations_evidence.pdf');
      if(dataUrl){ citFileData={name:'2.1.3_citations_evidence.pdf', dataUrl};
        const fn=document.getElementById('cit_file_name'); if(fn) fn.textContent='📄 2.1.3_citations_evidence.pdf';
        const fc=document.getElementById('cit_file_clear'); if(fc) fc.style.display='inline';
        linked++;
      }
    }

    renderManualSections(); renderJournals(); renderConf();
    let msg=linked>0?`✅ Re-linked ${linked} evidence file(s) from folder.`:`⚠️ No matching evidence files found in folder.`;
    if(missing.length) msg+=`<br>⚠️ Missing: ${missing.slice(0,5).map(f=>`<b>${f}</b>`).join(', ')}${missing.length>5?` +${missing.length-5} more`:''}`;
    showSaveNotice(msg, linked>0&&!missing.length?'ok':'warn');
    if(linked>0) markUnsaved();
  }catch(e){
    if(e.name==='AbortError') return;
    showSaveNotice('⚠️ Could not access folder: '+e.message,'warn');
  }
}
